name: chest
description: "Chest — an enterprise-grade mobile vault that freezes, hides and encrypts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Cryptography -------------------------------------------------------
  # Pure-Dart primitive library: Argon2id, HKDF, AES-256-GCM and
  # ChaCha20-Poly1305. Used to build Chest's cascade ("layered") pipeline
  # without delegating key derivation to the OS.
  cryptography: ^2.9.0
  crypto: ^3.0.7

  # --- Platform integration ----------------------------------------------
  # Hardware-backed secret storage (Android Keystore / StrongBox).
  flutter_secure_storage: ^11.2.0
  # Biometric unlock.
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  # No general-purpose file-picker plugin. Chest drives the Storage Access
  # Framework itself so it can ask for write access and read a file without the
  # plugin's habit of copying it into the app cache as plaintext first. See
  # android/app/src/main/kotlin/com/chest/chest/files/ChestFilePicker.kt.

  # --- State management ---------------------------------------------------
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
